<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Complete</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Poppins", Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.18), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(0, 0, 0, 0.25), transparent 35%),
                linear-gradient(135deg, #667eea, #764ba2);

            padding: 20px;
        }

        /* Glass Card */
        .glass-card {
            width: 100%;
            max-width: 500px;

            padding: 45px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.25);

            color: white;
        }

        /* Success Icon */
        .success-icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.35);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);

            animation: pop 0.6s ease;
        }

        .success-icon i {
            font-size: 42px;
            color: #ffffff;
        }

        /* Heading */
        h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* Description */
        p {
            font-size: 16px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.88);
            margin-bottom: 30px;
        }

        /* Login Button */
        .login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 14px 30px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.95);
            color: #5f4bb6;

            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            transition: all 0.3s ease;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .login-btn:hover {
            transform: translateY(-3px);

            background: #ffffff;

            color: #764ba2;

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.25);
        }

        .login-btn i {
            transition: transform 0.3s ease;
        }

        .login-btn:hover i {
            transform: translateX(4px);
        }

        /* Small text */
        .bottom-text {
            margin-top: 25px;
            margin-bottom: 0;

            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
        }

        /* Animation */
        @keyframes pop {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            70% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Mobile */
        @media (max-width: 576px) {

            .glass-card {
                padding: 35px 25px;
            }

            h1 {
                font-size: 25px;
            }

            p {
                font-size: 14px;
            }

            .success-icon {
                width: 75px;
                height: 75px;
            }

            .success-icon i {
                font-size: 34px;
            }

            .login-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="glass-card">

        <!-- Success Icon -->
        <div class="success-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <!-- Title -->
        <h1>Password Reset Complete</h1>

        <!-- Message -->
        <p>
            Your password has been successfully changed.
            You can now log in using your new password.
        </p>

        <!-- Login Button -->
        <a href="{% url 'login' %}" class="login-btn">
            <i class="fa-solid fa-right-to-bracket"></i>
            Log in
        </a>

        <p class="bottom-text">
            Your account is now secured with your new password.
        </p>

    </div>

</body>

</html>
