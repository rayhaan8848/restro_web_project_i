<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- cdn for bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- custom css links -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <!-- fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--  alertfy JavaScript -->
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <!-- aletrify css -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />
</head>

<body class="bg-light">
    <div class="container min-vh-100  d-flex align-items-center py-5">
        <div class="row w-100 bg-white shadow-lg rounded-4">
            <h1 class="text-center fw-bold fs-2 text-dark mb-4">
                <i class="fa-solid fa-lock me-2"></i>
                Change Your Password
            </h1>
            <div class="col-lg-6 text-white p-5 bg-dark d-flex justify-content-center align-items-center flex-column">
                <h1 class="fw-bold mb-3">Change Your password {{request.user.username}} G</h1>
                <img src="{% static 'images/pass.png' %}" class="img-fluid rounded-4 shadow"
                    style="max-height: 350px; object-fit: cover;" alt="">
            </div>
            <div class="col-lg-6">
                <div class="main">
                    <div>
                        <!-- From Uiverse.io by Yaya12085 -->
                        <form method="post" action="">
                            <a href="{% url 'index' %}"
                                class="btn btn-outline-secondary btn-sm position-absolute top-0 end-0 m-3">
                                <i class="fa-solid fa-xmark me-1"></i>
                                Back to Home
                            </a>
                            {% csrf_token %}
                            {{form}}
                            <input type="submit" value="Submit">
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>




    <!-- this is js cdn bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    {% if messages %}
    {% for message in messages %}
    {% if message.tags == 'success' %}
    <script> alertify.set('notifier', 'position', 'top-right');
        alertify.success('{{message}}');
    </script>
    {% else %}
    <script> alertify.set('notifier', 'position', 'top-right');
        alertify.error('{{message}}');
    </script>
    {% endif %}


    {% endfor %}

    {% endif %}

    <script>
        const togglePassword = document.getElementById("togglePassword");
        const password = document.getElementById("password");

        togglePassword.addEventListener("click", function () {
            if (password.type === "password") {
                password.type = "text";

                this.classList.remove("fa-eye");
                this.classList.add("fa-eye-slash");
            } else {
                password.type = "password";

                this.classList.remove("fa-eye-slash");
                this.classList.add("fa-eye");
            }
        });
    </script>
</body>

</html>
